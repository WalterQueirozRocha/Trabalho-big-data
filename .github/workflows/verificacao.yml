name: verificacao

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      # Os testes de banco e o de comparação com o CSV original são pulados aqui (sem .env e sem a base de 100 MB).
      - run: python -m unittest discover -s tests -v

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      # Usa providers simulados: não precisa de token e não cria nada no Aiven.
      - run: terraform test

  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (histórico completo)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact --verbose
